<!doctype html>
<!-- Purpose: fallback page shown when the user opens an unknown route. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found</title>
    <link rel="icon" type="image/png" href="img/flight(1).png?v=11" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Playfair+Display:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <style>
      body {
        margin: 0;
        font-family: "Manrope", "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        min-height: 100vh;
        background: var(--bg, linear-gradient(135deg, #fff7ef 0%, #f1e9df 55%, #e6f0ee 100%));
      }

      .notfound-wrap {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
        gap: 28px;
        align-items: center;
        padding: 40px 0;
      }

      .notfound-card {
        background: var(--panel, rgba(255, 255, 255, 0.88));
        border-radius: 28px;
        padding: 28px;
        box-shadow: var(--shadow, 0 24px 60px rgba(25, 21, 15, 0.2));
      }

      .notfound-code {
        font-size: clamp(52px, 6vw, 84px);
        margin: 0 0 12px;
        font-family: "Playfair Display", "Georgia", serif;
        letter-spacing: 2px;
      }

      .notfound-illustration {
        min-height: 320px;
        border-radius: 26px;
        background:
          linear-gradient(120deg, rgba(181, 96, 63, 0.12), rgba(42, 124, 122, 0.12)),
          url("img/travel6.jpg") center/cover no-repeat;
        box-shadow: 0 24px 60px rgba(25, 21, 15, 0.18);
        position: relative;
        overflow: hidden;
      }

      .notfound-illustration::after {
        content: "Lost in the routes";
        position: absolute;
        bottom: 18px;
        left: 18px;
        background: var(--panel, rgba(255, 255, 255, 0.85));
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }

      @media (max-width: 900px) {
        .notfound-wrap {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <nav class="nav" aria-label="Primary">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="about.html">About Us</a>
          <a class="nav-link" href="services.html">Services</a>
          <a class="nav-link" href="login.html">Login / Sign up</a>
        </nav>
        <div class="brand">
          <span class="brand-title">Routes-connect</span>
          <span class="brand-tag">Plan. Explore. Remember.</span>
        </div>
      </header>

      <main class="notfound-wrap">
        <section class="notfound-card">
          <p class="eyebrow">404</p>
          <h1 class="notfound-code">We couldn't find that page.</h1>
          <p class="lead">
            The link may be broken, or the page may have moved. Use the navigation
            above or return to the homepage.
          </p>
          <div class="cta-row">
            <a class="primary-btn" href="index.html">Back to Home</a>
            <a class="ghost-btn" href="services.html">Explore Services</a>
          </div>
        </section>
        <div class="notfound-illustration" aria-hidden="true"></div>
      </main>
    </div>
    <button class="floating-theme" type="button" data-theme-toggle aria-label="Toggle theme">
      <span class="floating-orb"></span>
      <span class="floating-label">Dark mode</span>
    </button>
    <script src="theme.js"></script>
  </body>
</html>
